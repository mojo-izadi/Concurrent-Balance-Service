name: concurrent-balance-service

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-concurrent_balance_service}
      POSTGRES_USER: ${POSTGRES_USER:-concurrent_balance_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concurrent_balance_service_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
