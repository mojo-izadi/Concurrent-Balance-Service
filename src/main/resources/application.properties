spring.application.name=concurrent-balance-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/concurrent_balance_service}
spring.datasource.username=${DATABASE_USERNAME:concurrent_balance_service}
spring.datasource.password=${DATABASE_PASSWORD:concurrent_balance_service_dev}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout = '60s'; SET lock_timeout = '${DATABASE_LOCK_TIMEOUT:5s}'; SET statement_timeout = '${DATABASE_STATEMENT_TIMEOUT:10s}'

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.deserialization.accept-float-as-int=false

balance.execution.max-concurrent-operations=${BALANCE_EXECUTION_MAX_CONCURRENT_OPERATIONS:10}
balance.execution.max-retries=${BALANCE_EXECUTION_MAX_RETRIES:3}
balance.execution.retry-delay=${BALANCE_EXECUTION_RETRY_DELAY:100ms}
balance.recovery.fixed-delay=${BALANCE_RECOVERY_FIXED_DELAY:5s}
balance.recovery.minimum-pending-age=${BALANCE_RECOVERY_MINIMUM_PENDING_AGE:5s}
